<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      background: #f4f7fb;
      color: #1b2a3a;
      z-index: 999999;
    }

    .platform-bootstrap-loader {
      display: grid;
      width: min(280px, calc(100vw - 48px));
      justify-items: center;
      gap: 10px;
      text-align: center;
    }

    .platform-bootstrap-loader__logo {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 10px 20px rgba(30, 93, 150, 0.18));
      animation: platform-bootstrap-breathe 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    .platform-bootstrap-loader strong {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 17px;
      line-height: 1.4;
    }

    .platform-bootstrap-loader > span {
      color: #627386;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    .platform-bootstrap-loader__track {
      width: 168px;
      height: 3px;
      margin-top: 4px;
      overflow: hidden;
      border-radius: 2px;
      background: #dbe4ee;
    }

    .platform-bootstrap-loader__track i {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #1e5d96, #4aa3e0);
      transform-origin: center;
      animation: platform-bootstrap-pulse 1.05s ease-in-out infinite;
    }

    @keyframes platform-bootstrap-breathe {
      0%, 100% { opacity: 0.74; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes platform-bootstrap-pulse {
      0%, 100% { opacity: 0.42; transform: scaleX(0.3); }
      50% { opacity: 1; transform: scaleX(1); }
    }

    @media (prefers-color-scheme: dark) {
      #loader-wrapper {
        background: #0c1420;
        color: #edf4fb;
      }

      .platform-bootstrap-loader > span {
        color: #9eb0c2;
      }

      .platform-bootstrap-loader__track {
        background: #263647;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .platform-bootstrap-loader__logo,
      .platform-bootstrap-loader__track i {
        animation: none;
      }

    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper" role="status" aria-live="polite" aria-label="正在启动华东信息融合平台">
      <div class="platform-bootstrap-loader">
        <img class="platform-bootstrap-loader__logo" src="/favicon.svg" alt="">
        <strong>华东信息融合平台</strong>
        <span>正在准备工作空间</span>
        <div class="platform-bootstrap-loader__track" aria-hidden="true"><i></i></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
