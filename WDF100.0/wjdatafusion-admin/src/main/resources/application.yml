# 项目相关配置
ruoyi:
  # 名称
  name: 华东信息融合平台
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: /Users/krizen/Documents/Code/projects/2026projects/rynew/ruoyiFiles/upload
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
log:
  path: /Users/krizen/Documents/Code/projects/2026projects/rynew/ruoyiFiles/logs

logging:
  level:
    com.hm: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: ${DOCUMENT_UPLOAD_MAX_FILE_SIZE:100MB}
      # 设置总上传的文件大小
      max-request-size: ${DOCUMENT_UPLOAD_MAX_REQUEST_SIZE:102MB}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      #password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.hm.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.hm.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 现场信息融合平台凭据加密
support:
  credential:
    key: "Sz9227328"

# 文档管理（纯内网部署）
document-management:
  # 生产环境应指向受备份保护的共享存储；默认落在 ruoyi.profile 下
  storage-root: ${DOCUMENT_STORAGE_ROOT:${ruoyi.profile}/documents}
  max-file-size: ${DOCUMENT_MAX_FILE_SIZE:104857600}
  # OOXML 解压后体积和条目数上限，防止压缩炸弹拖垮内网服务器
  max-expanded-file-size: ${DOCUMENT_MAX_EXPANDED_FILE_SIZE:262144000}
  max-archive-entries: ${DOCUMENT_MAX_ARCHIVE_ENTRIES:10000}
  # PDF 只做只读预览；上传时限制页数，避免异常页树消耗过多解析资源
  max-pdf-pages: ${DOCUMENT_MAX_PDF_PAGES:2000}
  # 批量下载只流式输出当前文件，不在服务器生成临时 zip
  max-batch-download-files: ${DOCUMENT_MAX_BATCH_DOWNLOAD_FILES:50}
  max-batch-download-size: ${DOCUMENT_MAX_BATCH_DOWNLOAD_SIZE:524288000}
  only-office:
    enabled: ${DOCUMENT_ONLYOFFICE_ENABLED:false}
    # 浏览器可访问的内网 ONLYOFFICE 地址
    server-url: ${DOCUMENT_ONLYOFFICE_SERVER_URL:http://127.0.0.1:8082}
    # ONLYOFFICE 容器访问本平台后端时使用的内网地址
    platform-base-url: ${DOCUMENT_PLATFORM_BASE_URL:http://host.docker.internal:8080}
    # 必须与 DocumentServer 的 JWT_SECRET 一致，生产环境至少32位并从环境变量注入
    jwt-secret: ${DOCUMENT_ONLYOFFICE_JWT_SECRET:}
    file-token-minutes: ${DOCUMENT_FILE_TOKEN_MINUTES:15}
    callback-token-hours: ${DOCUMENT_CALLBACK_TOKEN_HOURS:72}
    connect-timeout-seconds: ${DOCUMENT_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${DOCUMENT_READ_TIMEOUT_SECONDS:60}
    # 编辑器界面语言与度量/日期地区，内网现场默认中国简体中文
    language: ${DOCUMENT_ONLYOFFICE_LANGUAGE:zh-CN}
    region: ${DOCUMENT_ONLYOFFICE_REGION:zh-CN}
    # 仅允许从这些内网主机拉取 ONLYOFFICE 回调文件；多个值用英文逗号分隔
    trusted-download-hosts: ${DOCUMENT_ONLYOFFICE_TRUSTED_HOSTS:onlyoffice-documentserver}

