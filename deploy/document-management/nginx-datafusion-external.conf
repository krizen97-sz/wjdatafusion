map $http_upgrade $document_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /prod-api/ {
        proxy_pass http://2.57.0.250:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 复用现场 5554（公网映射 5555）入口，不额外暴露 ONLYOFFICE 端口。
    # datafusion-vue 容器需加入 rynew-document-management_onlyoffice_ingress 网络。
    location ^~ /onlyoffice/ {
        proxy_pass http://rynew-onlyoffice-gateway:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ONLYOFFICE 虚拟路径模式要求把路径一并放入 X-Forwarded-Host。
        proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $document_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }
}
