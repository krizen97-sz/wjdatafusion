# Based on the offline nginx.conf supplied for 32.73.150.46.
# Keep ordinary endpoints unchanged; only document upload has a dedicated limit.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    root /usr/local/nginx/dist;

    server {
        listen 80;
        server_name 32.73.150.46 localhost;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /prod-api/document/workspace/documents/upload {
            client_max_body_size 0;
            client_body_timeout 600s;
            proxy_pass http://127.0.0.1:8080/document/workspace/documents/upload;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_intercept_errors off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
        }

        location = /dev-api/document/workspace/documents/upload {
            client_max_body_size 0;
            client_body_timeout 600s;
            proxy_pass http://127.0.0.1:8080/document/workspace/documents/upload;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_intercept_errors off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
        }

        location /dev-api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
        }

        location /prod-api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
        }

        location = /50x.html {
            root dist;
        }
    }
}
