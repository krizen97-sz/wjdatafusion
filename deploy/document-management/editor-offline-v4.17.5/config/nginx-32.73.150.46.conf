# Complete host configuration for the supplied offline site 32.73.150.46.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $document_connection_upgrade {
        default upgrade;
        ''      close;
    }

    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    root /usr/local/nginx/dist;

    server {
        listen 80;
        server_name 32.73.150.46 localhost;

        location ^~ /onlyoffice/ {
            proxy_pass http://127.0.0.1:8082/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $document_connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /prod-api/document/workspace/documents/upload {
            client_max_body_size 0;
            client_body_timeout 600s;
            proxy_pass http://127.0.0.1:8080/document/workspace/documents/upload;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_intercept_errors off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
        }

        location = /dev-api/document/workspace/documents/upload {
            client_max_body_size 0;
            client_body_timeout 600s;
            proxy_pass http://127.0.0.1:8080/document/workspace/documents/upload;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_intercept_errors off;
            proxy_connect_timeout 30s;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_set_header Host $host;
        }

        location /dev-api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
        }

        location /prod-api/ {
            proxy_pass http://127.0.0.1:8080/;
            proxy_set_header Host $host;
        }

        location = /50x.html {
            root dist;
        }
    }
}
