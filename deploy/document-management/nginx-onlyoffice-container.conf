map $http_upgrade $document_connection_upgrade {
    default upgrade;
    ''      close;
}

# 保留上一级代理传入的公网协议、主机和 ONLYOFFICE 虚拟路径。
map $http_x_forwarded_proto $document_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $document_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

upstream onlyoffice_documentserver {
    server onlyoffice-documentserver:80;
    keepalive 32;
}

upstream rynew_backend {
    server host.docker.internal:8080;
    keepalive 16;
}

server {
    listen 8082;
    server_name _;

    client_max_body_size 100m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://onlyoffice_documentserver;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $document_forwarded_proto;
        proxy_set_header X-Forwarded-Host $document_forwarded_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $document_connection_upgrade;
        proxy_buffering off;
    }
}

# 仅在 Compose 内网中提供给 DocumentServer 的文件和保存回调通道；不发布到宿主机。
server {
    listen 8083;
    server_name _;

    client_max_body_size 100m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://rynew_backend;
        proxy_http_version 1.1;
        proxy_set_header Host host.docker.internal:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
    }
}
